[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "comment-moderator"
version = "1.0.0"
description = "Forum comment moderation with a local LLM (Ollama): classification, images, batch, chat and RAG over the forum rules."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Dawid Olko" }]

[project.scripts]
moderator = "moderator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
moderator = ["web/style.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E402", "B008"]
