models:
  text: qwen2.5:7b
  vision: gemma3:4b
  embed: nomic-embed-text

generation:
  temperature: 0.1
  top_p: 0.9
  top_k: 40
  num_ctx: 4096
  num_predict: 300
  seed: 42
  repeat_penalty: 1.1

chat:
  temperature: 0.3
  top_p: 0.9
  num_ctx: 8192
  num_predict: 700
  seed: 42

retrieval:
  method: dense
  top_k: 3
  always_include: ["§2.3"]
  use_embeddings: true
  skip_sections: ["§1", "§6"]
  rrf_k: 60

baseline:
  model: unitary/toxic-bert
  threshold: 0.5

paths:
  rules: data/rules/forum_rules.md
  comments_csv: data/comments.csv
  comments_txt: data/comments.txt
  output: out
